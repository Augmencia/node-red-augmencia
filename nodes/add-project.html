<script type="text/javascript">
  RED.nodes.registerType('augmencia-add-project',{
    category: 'augmencia',
    color: '#c1ade5',
    defaults: {
      name: {value:""},
      services: {value:"", type:"augmencia-services", required: true},
    },
    inputs: 1,
    outputs: 2,
    outputLabels: function(index) {
      switch (index) {
        case 0:
          return this._("augmencia-add-project.Project");
        case 1:
          return this._("augmencia-add-project.Error");
      }
      return '';
    },
    align: 'left',
    icon: "font-awesome/fa-list-ul",
    paletteLabel: function() {
      return this._("augmencia-add-project.Add project")
    },
    label: function() {
        return this.name||this._("augmencia-add-project.Add project");
    }
  });
</script>

<script type="text/html" data-template-name="augmencia-add-project">
  <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="augmencia-add-project.Name"/></label>
      <input type="text" id="node-input-name" data-i18n="[placeholder]augmencia-add-project.Name">
  </div>
  <div class="form-row">
    <label for="node-input-services"><i class="fa fa-cube"></i> Augmencia</label>
    <select id="node-input-services" data-i18n="[placeholder]augmencia-add-project.Services">
  </div>
</script>
