<script type="text/markdown" data-help-name="augmencia-get-content-upload-url">
Get an Augmencia content upload URL.

### Input

: payload (string) : The associated project's id

### Outputs

1. Upload data
: payload (GetContentUploadUrlResponse) : The data needed to upload the file

2. Error
: error (string) : The standard error message

### Types

#### GetContentUploadUrlResponse
: contentId (string) : The id of the content to upload.
: uploadUrl (string) : The URL to which upload the content using a POST request.
: formData (KeyValueStrings[]) : The form data to include when uploading the file. Add to it the file to upload as "form".

#### KeyValueStrings
: key (string) : 
: value (string) :
