Récupère les ressources associées à un projet Augmencia.

### Entrée

: payload (string) : L'id du projet

### Output

: payload (Asset[]) : Les ressources associées au projet donné

### Types

#### Asset
: folder (Folder|undefined) : 
: context (Context|undefined) : 
: image (Image|undefined) : 
: text (Text|undefined) : 
: object3D (Object3D|undefined) : 
: item ("folder"|"context"|"image"|"text"|"object3D") : The assets's type

#### Folder
: id (string) : 
: name (string) : 
: parentId (string) : 
: creationDate (number) : Creation's unix timetstamp
: modificationDate (number) : Last modification's unix timestamp
